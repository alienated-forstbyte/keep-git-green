name: Daily Counter Increment

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  # Allows triggering the workflow manually from GitHub UI for testing
  workflow_dispatch:

jobs:
  increment:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Grants permission to commit and push back to repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run increment script
        run: python increment_counter.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add counter.txt
          git commit -m "chore: increment counter [skip ci]" || exit 0
          git push
